services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ptp
      POSTGRES_USER: ptp
      POSTGRES_PASSWORD: ptp_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptp -d ptp"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
