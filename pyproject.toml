[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-training-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3", "djangorestframework>=3.17.2,<3.18",
  "psycopg[binary]>=3.2,<4", "numpy>=2,<3", "scipy>=1.14,<2",
  "opencv-python-headless>=4.10,<5", "jsonschema>=4.23,<5", "psutil>=6,<8"
]

[project.optional-dependencies]
cloud = ["google-auth>=2.59.1,<3", "requests>=2.34.2,<3", "gunicorn>=26.2,<27"]
dev = ["pytest>=8,<10", "pytest-django>=4.9,<5", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-jsonschema", "types-psutil"]

[tool.setuptools.packages.find]
include = ["analysis*", "backend*", "tools*", "ingestion*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.config.settings"
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires PostgreSQL", "media: executes FFmpeg", "sandbox: opt-in real Docker isolation checks"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "frontend", "backend/core/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["analysis", "tools", "ingestion"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
