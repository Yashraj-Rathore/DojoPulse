name: Local prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-companion:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ALLOW_SQLITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m companion --help
      - run: pytest tests/test_companion_sync.py -k "not real_supported" --junitxml=reports/windows-companion.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-companion-results
          path: reports/windows-companion.xml
  python-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ptp
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ptp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ptp" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ptp:ci-only@127.0.0.1:5432/ptp
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r requirements-cloud.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py load_contracts
      - run: pytest -q --junitxml=reports/pytest.xml
      - run: python manage.py rehearse_recovery --confirm-isolated-local --postgres-container-image postgres:17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-results
          path: |
            reports/pytest.xml
            reports/m17-load.json
  media-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOW_SQLITE: "1"
      PARSER_MAX_PROFILE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.lock
      - run: docker build -f infrastructure/Dockerfile.analysis -t dojopulse-parser:ci .
      - run: echo "PARSER_TEST_IMAGE=$(docker image inspect dojopulse-parser:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: pytest tests/test_parser_sandbox.py -v --junitxml=reports/sandbox.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-results
          path: reports/sandbox.xml
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --disable-pip --no-deps -r requirements.lock
      - run: pip-audit --disable-pip --no-deps -r requirements-cloud.lock
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: frontend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: frontend/test-results
  deployment-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
      - run: terraform fmt -check -recursive
        working-directory: infrastructure/google-cloud
      - run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: infrastructure/google-cloud
      - run: terraform validate
        working-directory: infrastructure/google-cloud
      - run: terraform test
        working-directory: infrastructure/google-cloud
  application-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/Dockerfile.api -t dojopulse-api:ci .
      - run: docker build -f infrastructure/Dockerfile.web -t dojopulse-web:ci .
      - name: Verify unprivileged API quarantine and standalone web
        run: |
          trap 'docker rm -f dojopulse-api-ci dojopulse-web-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name dojopulse-api-ci -p 127.0.0.1:8180:8080 \
            -e DJANGO_SECRET_KEY=ci-only-not-a-deployment-secret \
            -e DATABASE_URL=postgresql://fixture@127.0.0.1:5432/fixture \
            -e RESTORE_QUARANTINE=1 dojopulse-api:ci
          docker run -d --name dojopulse-web-ci -p 127.0.0.1:8181:8080 dojopulse-web:ci
          test "$(docker exec dojopulse-api-ci id -u)" = "10001"
          test "$(docker exec dojopulse-web-ci id -u)" != "0"
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /tmp/dojo-health --write-out '%{http_code}' http://127.0.0.1:8180/health/ready || true)
            if [ "$status" = "503" ]; then break; fi
            sleep 1
          done
          test "$status" = "503"
          test "$(cat /tmp/dojo-health)" = '{"status": "QUARANTINED"}'
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8181/ >/dev/null
          curl --fail http://127.0.0.1:8181/images/dojo-training.webp --output /tmp/dojo-hero.webp
          cmp frontend/public/images/dojo-training.webp /tmp/dojo-hero.webp
          curl --fail http://127.0.0.1:8181/icon.svg --output /tmp/dojo-icon.svg
          cmp frontend/public/icon.svg /tmp/dojo-icon.svg
