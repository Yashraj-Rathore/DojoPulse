name: Local prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ptp
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ptp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ptp" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ptp:ci-only@127.0.0.1:5432/ptp
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py load_contracts
      - run: pytest -q --junitxml=reports/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-results
          path: reports/pytest.xml
  media-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOW_SQLITE: "1"
      PARSER_MAX_PROFILE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.lock
      - run: docker build -f infrastructure/Dockerfile.analysis -t dojopulse-parser:ci .
      - run: echo "PARSER_TEST_IMAGE=$(docker image inspect dojopulse-parser:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: pytest tests/test_parser_sandbox.py -v --junitxml=reports/sandbox.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-results
          path: reports/sandbox.xml
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --disable-pip --no-deps -r requirements.lock
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: frontend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: frontend/test-results
